<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = Math.floor(Math.random() * 100) + 1;
        let count = 0;
        let n = -1;

        while (n !== num) {
            let input = prompt("Enter a number between 1 to 100:");

            if (input === null) {
                alert("Game cancelled!");
                console.log("Game cancelled by user.");
                break;
            }

            n = Number(input);

            if (input.trim() === "" || isNaN(n)) {
                alert("Please enter a valid number!");
                continue;
            }

            count++;

            if (n > num) {
                alert("Too high! Try a smaller number.");
            } else if (n < num) {
                alert("Too low! Try a larger number.");
            } else if (n === num) {
                alert(`🎉 You guessed the number ${num} in ${count} attempts!`);
                break;
            }
        }
    </script>
</body>

</html>
